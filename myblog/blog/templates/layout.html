<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <title>Document</title>
    <style>
        /* Mobile Devices */
@media (max-width: 768px){

    body{
        padding: 15px;
    }

    .box{
        width: 95%;
        padding: 20px;
    }

    h1{
        font-size: 34px;
    }

    .post-title{
        font-size: 26px;
    }

    p{
        font-size: 15px;
        line-height: 1.7;
    }
}

     @keyframes blueColorChange {
        0%   { background-color: #E0F7FA; } 
        25%  { background-color: #B2EBF2; } 
        50%  { background-color: #80DEEA; } 
         75%  { background-color: #4DD0E1; } 
        100% { background-color: #E0F7FA; } 
    }

body {
    font-family: 'Poppins', sans-serif;
      margin: 0;
padding: 30px;
min-height: 100vh;
     /* 16 seconds makes the transition slower and calmer */
        animation: blueColorChange 16s infinite ease-in-out;
}

/* Heading */
h1 {
    background: linear-gradient(to right, #0077ff, #00c6ff);
    background-clip: text;
    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;
    font-size: 40px;
    text-align: center;
    margin-bottom: 40px;

    animation: slideInUp 1s ease-out forwards;
}

/* Animation */
@keyframes slideInUp {

    0% {
        opacity: 0;
        transform: translateY(30px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Blog Box */
.box {

    width: 90%;
    max-width: 1100px;

    margin: 30px auto;

    padding: 30px;

    background: rgba(255,255,255,0.85);

    backdrop-filter: blur(10px);

    border-radius: 24px;

    border: 1px solid rgba(255,255,255,0.3);

    box-shadow: 0 8px 30px rgba(0,0,0,0.1);

    transition: all 0.4s ease;

    cursor: pointer;
}

/* Hover Effect */
.box:hover {

    transform: translateY(-12px) scale(1.02);

    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

/* Title */
.post-title {

    font-size: 36px;
    color: #222;
    margin-bottom: 15px;

    text-align: center;
}

/* Paragraph */
p {

   

   color: #555;
    line-height: 1.8;
    font-size: 18px;
}

</style>           

    
</head>
<body>
    <h1>Blog WEB</h1>
     {% block content %}
    {% endblock %}
    
</body>
</html>
